[project]
name = "ianord-data-bridge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "category-encoders>=2.9.0",
    "dotenv>=0.9.9",
    "matplotlib>=3.10.7",
    "pandas>=2.3.3",
    "pmdarima>=2.1.1",
    "prophet>=1.2.1",
    "pyarrow>=22.0.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.5",
    "python-dateutil>=2.9.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "trino>=0.336.0",
    "xgboost>=3.1.2",
    "rapidfuzz>=3.0",
    "fastapi>=0.131.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "openpyxl>=3.1",
    "uvicorn>=0.41.0",
    "streamlit>=1.55.0",
    "plotly>=6.6.0",
]

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["data_process*", "prediction_passages*"]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "uv>=0.9.13",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
]
