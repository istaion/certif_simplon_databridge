depends_on:
  - 10-test

steps:
  build_nightly_databridge:
    image: woodpeckerci/plugin-docker-buildx
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    settings:
      dockerfile: Dockerfile
      registry: sb07qkc1.gra7.container-registry.ovh.net
      username:
        from_secret: harbor_username
      password:
        from_secret: harbor_password
      repo: sb07qkc1.gra7.container-registry.ovh.net/internal/${CI_REPO_NAME}
      tags:
        - ${CI_COMMIT_SHA}
        - nightly
        - development
    when:
      - event:
          include: [push]
        branch:
          include: [dev*, main]
  
  build_stable_databridge:
    image: woodpeckerci/plugin-docker-buildx
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    settings:
      dockerfile: Dockerfile
      registry: sb07qkc1.gra7.container-registry.ovh.net
      username:
        from_secret: harbor_username
      password:
        from_secret: harbor_password
      repo: sb07qkc1.gra7.container-registry.ovh.net/internal/${CI_REPO_NAME}
      tags:
        - ${CI_COMMIT_SHA}
        - ${CI_COMMIT_TAG}
        - stable
        - latest
    when:
      - event:
          include: [tag]
        branch:
          include: [main]
